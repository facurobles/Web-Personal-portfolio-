<section class="projects-section" aria-labelledby="projects-title">
    <div class="projects-window">
        <div class="projects-header">
            <span id="projects-title">03_PROJECTS</span>
        </div>

        <nav class="project-filters" aria-label="Filter projects">
            <button *ngFor="let filter of filters" type="button" [class.active-filter]="activeFilter === filter"
                (click)="setFilter(filter)">{{filter}}</button>
        </nav>

        <div class="projects-grid">
            <app-project-card *ngFor="let project of filteredProjects" [project]="project"
                (details)="openDetails($event)"></app-project-card>
        </div>
    </div>

    <div class="project-modal" *ngIf="selectedProject" (click)="closeDetails()">
        <article class="detail-window" role="dialog" aria-modal="true" [attr.aria-label]="selectedProject.title"
            (click)="$event.stopPropagation()">
            <div class="detail-header">
                <span>{{selectedProject.id}} · DETAIL_VIEW</span>
                <button type="button" aria-label="Close project details" (click)="closeDetails()">[ X ]</button>
            </div>
            <div class="detail-content">
                <p class="detail-label">{{selectedProject.type}} · {{selectedProject.status}}</p>
                <h2>{{selectedProject.title}}</h2>
                <p>{{selectedProject.description}}</p>
                <p><strong>MY CONTRIBUTION</strong><br>{{selectedProject.contribution}}</p>
                <p class="detail-stack"><strong>STACK</strong><br>{{selectedProject.technologies.join(' · ')}}</p>
                <a *ngIf="selectedProject.demoUrl" [href]="selectedProject.demoUrl" target="_blank" rel="noopener noreferrer">OPEN APP</a>
            </div>
        </article>
    </div>
</section>
