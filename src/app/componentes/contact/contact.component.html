<section class="contact-section" aria-labelledby="contact-title">
    <div class="contact-window">
        <div class="contact-header">
            <span id="contact-title">05_CONTACT</span>
        </div>

        <div class="contact-content">
            <div class="contact-intro">
                <h1>Let's build something useful.</h1>
                <p>Have a Java project, a backend challenge or an opportunity to share? Send me a message and I’ll get back to you.</p>
            </div>

            <form (ngSubmit)="onSubmit()" [formGroup]="contactForm">
                <div class="form-field">
                    <label for="contact-name">NAME</label>
                    <input id="contact-name" type="text" required formControlName="name" placeholder="your name">
                    <div class="form-error" *ngIf="contactForm.get('name')?.touched && contactForm.get('name')?.errors?.['required']">&gt; name is required</div>
                    <div class="form-error" *ngIf="contactForm.get('name')?.touched && contactForm.get('name')?.errors?.['minlength']">&gt; use at least 3 characters</div>
                </div>

                <div class="form-field">
                    <label for="contact-email">EMAIL</label>
                    <input id="contact-email" type="email" required formControlName="email" placeholder="you@example.com">
                    <div class="form-error" *ngIf="contactForm.get('email')?.touched && contactForm.get('email')?.errors?.['required']">&gt; email is required</div>
                    <div class="form-error" *ngIf="contactForm.get('email')?.touched && contactForm.get('email')?.errors?.['email']">&gt; enter a valid email</div>
                </div>

                <div class="form-field">
                    <label for="contact-message">MESSAGE</label>
                    <textarea id="contact-message" maxlength="400" required formControlName="message" placeholder="write your message..."></textarea>
                    <div class="form-error" *ngIf="contactForm.get('message')?.touched && contactForm.get('message')?.errors?.['required']">&gt; message is required</div>
                </div>

                <button type="submit" [disabled]="contactForm.invalid">[ SEND TRANSMISSION ]</button>
            </form>
        </div>
    </div>
</section>
